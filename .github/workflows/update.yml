name: Aggiorna i livelli e pubblica

on:
  schedule:
    - cron: '15 4 * * *'    # ogni giorno alle 04:15 UTC (06:15 ora italiana estiva)
    - cron: '15 16 * * *'   # e alle 16:15 UTC: il flusso ARPA è in tempo reale, due letture al giorno tengono lo stato fresco
  workflow_dispatch:
    inputs:
      years:
        description: >-
          Anni da (ri)scaricare. Lasciare il default per l'aggiornamento normale; "all" una tantum per il bootstrap
          della storia dal 2011 (una decina di minuti). Gli anni senza file vengono comunque scaricati.
        default: 'current,previous'
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore: ['README.md', 'README.en.md', 'docs/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fiumi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Controlla l'anagrafica (segnala nuovi idrometri non a catalogo)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/fetch_stations.py --check
        continue-on-error: true

      - name: Scarica e aggrega i livelli (anno corrente + precedente, più gli anni mancanti)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/fetch_levels.py --years "${{ inputs.years || 'current,previous' }}"

      - name: Scarica le finestre orarie delle piene (solo eventi nuovi)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/fetch_events.py
        continue-on-error: true

      - name: Costruisci site/data/
        run: python scripts/build_data.py

      # I file annuali sono versionati anche per gli anni aperti: il flusso ARPA è una finestra scorrevole di pochi mesi,
      # quindi i giorni non salvati sparirebbero fino alla pubblicazione della serie validata. Il commit notturno è piccolo.
      # Il commit va fatto sopra l'ULTIMO main, non sul commit da cui è partito il run: un re-run di un run vecchio,
      # o un push fatto nel frattempo, farebbero altrimenti rifiutare il push ("fetch first"). I dati prodotti da questo
      # run vengono messi da parte, il ramo riallineato a origin/main e i file riapplicati tali e quali (gli aggregati
      # giornalieri sono ricalcolati da zero a ogni run, quindi la versione appena scaricata è quella buona).
      - name: Committa i dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/levels-*.json data/events/*.json
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da committare."
            exit 0
          fi
          git stash push -- data/levels-*.json data/events/*.json           # i file sono già in index, anche quelli nuovi
          esito=1
          for tentativo in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git checkout 'stash@{0}' -- data/
            git add data/levels-*.json data/events/*.json
            if git diff --cached --quiet; then
              echo "Nessun dato nuovo rispetto a origin/main."
              esito=0; break
            fi
            git commit -m "Aggiorna i livelli ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            if git push origin HEAD:main; then
              esito=0; break
            fi
            echo "Push rifiutato (main è cambiato nel frattempo), tentativo $tentativo di 3"
            sleep 20
          done
          git stash drop
          exit $esito

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
